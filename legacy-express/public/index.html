<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Points Table — Mini Militia Season 2</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="points">
<header class="app-header">
  <div class="title-row">
    <h1>Mini Militia — Season 2<small>League Points Table</small></h1>
  </div>
  <nav class="tabs">
    <a href="index.html" data-page="points">Points Table</a>
    <a href="schedule.html" data-page="schedule">Schedule &amp; Results</a>
    <a href="leaderboards.html" data-page="leaderboards">Leaderboards</a>
    <a href="finals.html" data-page="finals">Finals</a>
    <a href="admin/login.html" data-page="admin">Admin</a>
  </nav>
</header>
<main>
  <div id="zone-banner"></div>
  <div class="card">
    <h2>League Points Table</h2>
    <p class="muted">Top 3 teams qualify for the Finals once the league stage is marked complete.</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Team</th><th>MP</th><th>1st</th><th>2nd</th><th>3rd</th><th>Kills</th><th>Points</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="8" class="muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<footer class="hint">Standings update automatically as match results are entered.</footer>
<script src="js/common.js"></script>
<script src="js/points.js"></script>
</body>
</html>
